[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xl-diff"
version = "0.1.0"
description = "Concise spreadsheet diff utility (CSV/XLSX)"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "Muhammad Umer" } ]
dependencies = ["pandas>=1.5", "openpyxl>=3.0"]
